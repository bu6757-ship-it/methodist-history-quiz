<script>
const all=[{"n": 1, "q": "910년 일제가 우리 민족을 대상으로 무단 통치를 하면서 향후 야기될 항일 운동 세력을 제거할 목적으로 한민족과 한국기독교를 탄압하기 위해 고의적으로 날조하여 일으킨 사건은 무엇인가?", "choices": [], "a": "105인 사건"}, {"n": 2, "q": "3.1운동의 이념적 근거인 독립선언서에 서명한 33인 중에 참여하지 않은 종교는 어떤 종교인가?", "choices": ["① 기독교", "② 천주교", "③ 불교", "④ 천도교"], "a": "② 천주교"}, {"n": 3, "q": "3.1만세운동에 참여하지 않은 여학교는 어떤 학교인가?", "choices": ["① 이화학당", "② 배화여학교", "③ 호수돈여학교", "④ 공옥여학교"], "a": "④ 공옥여학교"}, {"n": 4, "q": "말 기독교인들의 민족운동 참여를 보여주는 운동으로서 일체의 정치, 경제적 침략에 대한 민간차원의 운동으로서 남성들은 주로 술과 담배를 끊고 여성들은 쌀과 반지를 내어 국채보상금으로 충당하려 했던 국권회복운동의 한 방편으로 일으킨 운동은 무엇인가?", "choices": [], "a": "국체보상운동"}, {"n": 5, "q": "1930년 기독교조선감리회가 창립총회를 갖고 시작하였는데 한국감리회의 설립 취지로 3대 원칙을 선포하였는데 아닌 것은?", "choices": ["① 진정한 기독교회", "② 진정한 감리교회", "③ 진정한 초대교회", "④ 한국적 교회"], "a": "③ 진정한 초대교회"}, {"n": 6, "q": "1920년대 말과 1930년 초 5년여에 불과한 짧은 기간 동안 활약한 한국감리교 목사로서 자신의 깊은 영적 체험에 근거해 흔들리는 한국교회의 개혁을 외친 설교자는 누구인가?", "choices": [], "a": "이용도"}, {"n": 7, "q": "일제의 신사참배 강요에 굴하지 않고 끝까지 신사참배를 거부하여 저항하다 순교한 감리교 지도자가 아닌 인물은 누구인가?", "choices": ["① 양주삼", "② 최인규", "③ 강종근", "④ 권원호"], "a": "① 양주삼"}, {"n": 8, "q": "북한지역 감리교회를 이끌어 갈 교역자를 양성하기 위하여 평양에 신학 교육 기관인 성화신학교가 설립된 연도는?", "choices": ["① 1944년", "② 1945년", "③ 1946년", "④ 1947년"], "a": "③ 1946년"}, {"n": 9, "q": "6.25전쟁시 구호활동과 관련이 없는 단체나 인물은?", "choices": ["① 남궁억", "② 류형기", "③ 기독교세계봉사회(CWS)", "④ 감리교해외구제위원회(MCOR)"], "a": "① 남궁억"}, {"n": 10, "q": "괄호 안에 들어갈 학자의 이름을 쓰시오.\n“1960년대 한국감리교회의 신학을 특징짓는 토착화 신학작품으로 (       )의 ”한국신학병법서설“과 유동식의 ”한국종교와 기독교“가 있다.”", "choices": [], "a": "윤성범"}, {"n": 11, "q": "1966년 9월 총회에서 감독선거 투표를 110차례 하면서 형성된 한국감리교회 서클정치의 기본구조에 속하지 않는 그룹은?", "choices": ["① 호헌파", "② 갱신파", "③ 성화파", "④ 정동파"], "a": "② 갱신파"}, {"n": 12, "q": "“한국 기독교 선교 100주년을 맞이하여 1985년까지 감리교단이 정한 선교 목표는 5,000교회 ( ) 신도였다.", "choices": ["① 50만", "② 80만", "③ 100만", "④ 120만"], "a": "③ 100만"}, {"n": 13, "q": "한국교회의 대북지원이 본격화된 1990년대 후반부터 감리교회의 대북 선교 창구 역할을 한 연회는 무슨 연회인가?", "choices": [], "a": "서부연회"}, {"n": 14, "q": "초기 미국 북감리교 선교사가 아닌 인물은 누구인가?", "choices": ["① 스크랜턴 대부인 (M. F. Scranton)", "② 아펜젤러 (H. G. Appenzeller)", "③ 언더우드 (H. G. Underwood)", "④ 스크랜턴 (W. B. Scranton)"], "a": "④ 스크랜턴 (W. B. Scranton)"}, {"n": 15, "q": "미국 북감리교 존스 선교사가 세운 학교는 무엇인가?", "choices": ["① 영화학교", "② 배재학당", "③ 경신학교", "④ 숭실학교"], "a": "① 영화학교"}, {"n": 16, "q": "목회자 신분으로 상동교회 엡윗청년회를 비롯한 구국기도회, 신민회 조직 주도와 헤이그 밀사 파견을 도왔던 한국인 감리교 목사는 누구인가?", "choices": [], "a": "전덕기"}, {"n": 17, "q": "1907년 대부흥운동의 결과 회개하고 이웃에게 입혔던 손해를 배상하며 양심전 운동을 일으킨 대표적인 인물은?", "choices": ["① 김창식", "② 김기범", "③ 윤성근", "④ 이덕수"], "a": "③ 윤성근"}, {"n": 18, "q": "기독교대한감리회는 장로교보다 6년이나 앞서(1901년 5월 18일, 제17차 미국감리회 한국선교회) 한국인에게 목사 안수를 먼저 주었다. 초기 한국 감리교회를 위해 헌신했던 인물로 “조선의 바울”이라는 별명을 얻은 목사는 누구인가?", "choices": ["① 김창식", "② 안중근", "③ 길선주", "④ 양주삼"], "a": "① 김창식"}, {"n": 19, "q": "복궁 근처의 자골에 배화학당 혹은 배화여학교를 세웠고 종교교회, 자교교회의 전신인 자골교회를 세운 미국 남감리교 선교사의 이름은 무엇인가?", "choices": [], "a": "캠벨"}, {"n": 20, "q": "충청도 지역의 여성 선교와 교육을 위해 헌신했던 이로서 충청도 공주 지역의 선교를 하였으며, 2층짜리 양옥집을 지어 여기서 공주의 유명한 양명학교가 시작되었다. 관련된 인물은 누구인가?", "choices": ["① 앨리스 샤프 (Alice H. Sharp)", "② 무스 (J. R. Moose)", "③ 반스커크 (James D. VanBuskirk)", "④ 해리스 (M. C. Harris)"], "a": "① 앨리스 샤프 (Alice H. Sharp)"}, {"n": 21, "q": "초기 내한 선교사들이 세웠던 감리교회의 기관이 아닌 것은?", "choices": ["① 배재학당", "② 이화학당", "③ 협성신학교", "④ 서울신학교"], "a": "④ 서울신학교"}, {"n": 22, "q": "초기 한국에 선교를 했던 감리교 선교사가 아닌 분은?", "choices": ["① 아펜젤러(H. G. Appenzeller)", "② 스크랜턴(W. B. Scranton)", "③ 매클레이(R. S. Maclay)", "④ 언더우드(H. G. Underwood)"], "a": "④ 언더우드(H. G. Underwood)"}, {"n": 23, "q": "초기에 세워진 감리교회가 아닌 곳은?", "choices": ["① 정동교회", "② 종교교회", "③ 석교교회", "④ 새문안교회"], "a": "④ 새문안교회"}, {"n": 24, "q": "1907년 대부흥운동의 시작은?", "choices": ["① 1903년 원산부흥운동", "② 신민회 조직", "③ 헤이그 특사 파견", "④ 영아소동"], "a": "① 1903년 원산부흥운동"}, {"n": 25, "q": "한국 최초의 집사목사안수를 받은 한국인으로서 평양지역 목회를 담당했던 이는?", "choices": ["① 노블(W. A. Noble)", "② 폴웰(E. D. Follwell)", "③ 김창식", "④ 주시경"], "a": "③ 김창식"}, {"n": 26, "q": "최초의 공식 미국 이민으로 기록되는 1901년 해외 이민 장소는 어디인가?", "choices": [], "a": "하와이"}, {"n": 27, "q": "한국 개신교의 첫 번째 전도서이자 변증론인 『파혹진선론』을 저술한 이는 누구인가?", "choices": ["① 유관순", "② 노병선", "③ 길선주", "④ 안창호"], "a": "② 노병선"}, {"n": 28, "q": "다음은 누구에 대한 설명인가?\n- 3.1 운동 민족대표 33인중 한 사람으로 자의로 월북함\n- 1947년 서울에서 ‘기독교민주동맹’을 조직하여 활동\n- 북한 최고인민회의 부의장, 조국통일민주주의전선 중앙위원회 의장에 추대되어 활동", "choices": ["① 양주삼", "② 김유순", "③ 김창준", "④ 정춘수"], "a": "③ 김창준"}, {"n": 29, "q": "천주교의 캐럴(George Carroll) 신부와 윌리엄 쇼(William E. Shaw)가 이승만에게 건의함으로 만들어진 제도는 무엇인가?", "choices": [], "a": "군종제도"}, {"n": 30, "q": "괄호 안에 들어갈 말을 쓰시오. \n\"1966년 9월 20일 정동교회에서 열린 총회부터 감리교 서클정치의 구조는 (     )파-호헌파-정동파로 변하였다.\"", "choices": [], "a": "성화"}, {"n": 31, "q": "6.25 전쟁 시기 감리교 재건과정에서 발생한 문제 중 하나는 교역자 부족이었다. 이를 위한 해결책은 다음과 같은데, 괄호에 적당한 말은 무엇인가?\n“1951년 11월 부산의 총회에서 3년제 (     ) 설치 건의안이 상정되었고 1953년 9월 서울 감리교신학교에 (     )가 개설되었는데, 이것은 교역자의 부족 때문이었다. (     )는 학교교육과정의 본과라기 보다는 그것에 부속되어 단기간 공부하는 과정이었다.”", "choices": ["① 서리과", "② 전수과", "③ 전도과", "④ 중등과"], "a": "② 전수과"}, {"n": 32, "q": "1960년대 한국감리교회는 토착화 신학연구의 풍토가 형성되는 시기였다. 토착화 신학연구의 대표적인 인물로 “한국 종교와 기독교”(1965)에서 기독교의 복음과 한국문화의 바탕이 되는 한국종교에 대한 이해를 바탕으로 전개한 토착화 신학자는 누구인가?", "choices": ["① 윤성범", "② 유동식", "③ 변선환", "④ 남기철"], "a": "② 유동식"}, {"n": 33, "q": "1995년 7월, 북한 선교에 대한 홍보, 대북 인도적 지원, 북한 선교 사역자 양성, 북한 선교기금 조성 등을 통하여 북한 지역에 있던 감리교회 재건을 준비하기 위해 조직된 연회는 무슨 연회인가?", "choices": [], "a": "서부연회"}, {"n": 34, "q": "한국 감리교회의 설립 취지 3대 원칙은 무엇인가?", "choices": [], "a": "진정한 기독교회, 진정한 감리교회, 조선적 교회"}, {"n": 35, "q": "다음 중 ‘조선남북감리교회 통합방침연구연합위원회’의 “합동 5원칙”에 대한 내용으로 바르지 않은 것은?", "choices": ["① 조선에 있는 남북 두 감리회를 합동하여 단일 감리교회로 만든다.", "② 합동 후에도 계속 ‘미감리’ 또는 ‘남감리’라는 명칭을 사용한다.", "③ 교회에서 사용하는 예문과 장정을 통일시킨다.", "④ 교역자들은 조선감리회 감독이 남북감리회를 가리지 않고 어디든지 파송한다."], "a": "② 합동 후에도 계속 ‘미감리’ 또는 ‘남감리’라는 명칭을 사용한다."}, {"n": 36, "q": "다음 중 이용도 목사가 본 한국교회의 문제에 대한 설명으로 옳지 않은 것은?", "choices": ["① 교인들이 헌금하는데 열심을 다하지 못한다고 비판하였다.", "② 사랑과 헌신이 없는 이기적인 기독교인에 대해 비판하였다.", "③ 교리 중심적이고 형식화된 교회를 비판하였다.", "④ 목회자들이 교권주의(권위주의)를 비판하였다."], "a": "① 교인들이 헌금하는데 열심을 다하지 못한다고 비판하였다."}, {"n": 37, "q": "민족대표 33인의 한 사람으로 민족정신과 독립운동을 지속한 인천 내리교회 담임목사로 활동했던 감리교회의 민족운동의 주역인 이 사람은 누구인가?", "choices": ["① 신홍식 목사", "② 신석구 목사", "③ 최성모 목사", "④ 현순 목사"], "a": "① 신홍식 목사"}, {"n": 38, "q": "평남 강서에서 태어났으며, 진남포 감리교회 전도사로 파송 받아 목회하기 시작했고, 1910년 집사목사로 안수 받고, 중국과 만주에서 선교사로 활약했으며 나아가 민족 구원 활동을 펼친 인물은?", "choices": [], "a": "손정도"}, {"n": 39, "q": "일제가 한국을 식민지화하고 지배하려던 때에 가장 큰 걸림돌은 한국인이 지닌 민족의식이었다. 일제가 합방 초기부터 한국인의 민족의식을 제거하려고 채택한 정책이 동화정책인데, 일제가 시간이 지나가면서 보다 더 적극적으로 밀고 나간 정책은 무엇인가?", "choices": [], "a": "민족 말살 정책"}, {"n": 40, "q": "대부분 교회 지도자와 목회자들이 일제의 강압에 굴복하고 비신앙적이고 반민족적인 모습을 보여주고 있을 때, 일부 감리교인들은 신사참배를 거부하며 신앙을 지키려 하였다. 이러한 사람이 아닌 인물은?", "choices": ["① 강종근 목사", "③ 최인규 권사", "② 권원호 전도사", "④ 신흥우 목사"], "a": "④ 신흥우 목사"}, {"n": 41, "q": "해방 이후 감리교회를 다시 세우겠다고 하며 역사상 처음으로 분열된 감리교회는 어떻게 분열되었는가?", "choices": ["① 혁신파 - 재건파", "② 재건파 - 복흥파", "③ 복흥파 - 남부파", "④ 남부파 - 혁신파"], "a": "② 재건파 - 복흥파"}, {"n": 42, "q": "서부연회가 1946년 6월 북한지역 감리교회를 이끌어 갈 교역자를 양성하기 위하여 평양에 세운 신학교의 이름은 무엇인가?", "choices": [], "a": "성화신학교"}, {"n": 43, "q": "6.25전쟁 기간 중 북한으로 강제로 끌려가거나 자의로 월북한 감리교회 목사가 아닌 인물을 고르시오.", "choices": ["① 양주삼", "② 김유순", "③ 김창준", "④ 류형기"], "a": "④ 류형기"}, {"n": 44, "q": "다음 내용 가운데 서로 관련이 없는 하나를 고르시오.", "choices": ["① 윤성범", "② 유동식", "③ 토착화 신학", "④ 민중 신학"], "a": "④ 민중 신학"}, {"n": 45, "q": "다음 설명에 해당하는 것을 고르시오.\n“한국 감리교회는 1930년 자치교회를 선언했음에도 이후에도 여전히 미국 감리교회를 모교회로 인식했다. 그러다 1968년 한국 및 미국 감리교회가 모자관계에서 동반자관계로 전환하는 문제를 협의하기 위하여 (    )선교정책협의회가 열렸다. 협의 결과, 한국교회에 이양할 재산 목록에 학교, 병원, 사회관 등이 포함되었다.”", "choices": ["① 공주", "② 온양", "③ 수원", "④ 원주"], "a": "② 온양"}, {"n": 46, "q": "60-70년대 산업전도가 산업선교로 발전하는 중심에 있던 선교사는 누구인가?", "choices": ["① 나일즈", "② 찰스 스톡스", "③ 레인스", "④ 조지 오글"], "a": "④ 조지 오글"}, {"n": 47, "q": "1910년 일제 강점이 시작되자 일제는 조선 총독부를 신설하고 헌병 경찰제도를 통한 무단통치를 시작하였다. 일제는 향후에 야기될 항일 운동의 주요세력을 제거할 목적으로 사건을 일으켰는데 한민족에 대한 탄압 사건인 동시에 한국 기독교에 대한 박해 사건이기도 하였다. 이 사건을 일명 무슨 사건이라고 하는가?", "choices": [], "a": "105인 사건"}, {"n": 48, "q": "한국 감리교회의 3.1운동과 직접적으로 관련이 없는 인물은 누구인가?", "choices": ["① 유관순", "② 최성모", "③ 김창준", "④ 전덕기"], "a": "④ 전덕기"}, {"n": 49, "q": "920년대 후반의 대표적인 항일단체로 1927년 민족주의를 표방하고 민족주의자와 사회주의자가 제휴하여 창립한 민족운동단체이다. 기독교와 사회주의 지도자들이 모여 이념과 신념을 초월하여 민족의 자주 독립을 추구하자는 취지에서 세운 단체의 이름은 무엇인가?", "choices": [], "a": "신간회"}, {"n": 50, "q": "정경옥은 1903년 전남 진도에서 태어나 1924년 감리교신학교에 입학하여 공부하였고 1928년에 미국에 건너가 공부한 후 한국으로 들어왔다. 1931년부터 감리교신학교에서 강의한 대표적인 신학자인 정경옥 교수의 신학이 아닌 것은?", "choices": ["① 종합적 복음주의 신학", "② 경험을 바탕한 실천신학", "③ 성서에 입각한 근본주의 신학", "④ 토착화 신학"], "a": "③ 성서에 입각한 근본주의 신학"}, {"n": 51, "q": "1920년대 말부터 1930년대 초까지 한국교회의 세속화를 한탄하며 회개의 영성, 기도의 영성, 사랑의 영성을 강조하며 한국교회의 개혁을 외친 설교자는 누구인가?", "choices": [], "a": "이용도"}, {"n": 52, "q": "일제 말기 일본은 천황제 국가를 확립하기 위하여 천황을 신성시하면서 국가 신도로 발전시켰다. 일본이 천황신을 모시는 신사를 만들어 한국인들에게 강요하여 기독교인들이 거부감을 갖게 한 정책은 무엇인가?", "choices": [], "a": "신사참배"}, {"n": 53, "q": "일제의 황민화 정책에 순응하여 부일 협력한 인물이 아닌 사람은?", "choices": ["① 최인규", "② 박희도", "③ 신흥우", "④ 정춘수"], "a": "① 최인규"}, {"n": 54, "q": "1907년 대부흥운동의 진원인 1903년 원산 대부흥운동을 주도했던 대표적인 남감리회 선교사는 누구인가?", "choices": [], "a": "하디"}, {"n": 55, "q": "대부흥운동의 결과 회개한 물질의 배상으로 양심전(보상) 운동을 일으킨 대표적인 인물은?", "choices": ["① 김창식", "② 김기범", "③ 윤성근", "④ 이덕수"], "a": "③ 윤성근"}, {"n": 56, "q": "한국인에게 복음을 전하려는 목적으로 쓴 「성산명경」, 「만종일련」 등을 지은 이는 누구인가?", "choices": [], "a": "최병헌"}, {"n": 57, "q": "초기 미국 북감리교 선교사가 아닌 인물은 누구인가?", "choices": ["① 스크랜턴 대부인 (M. F. Scranton)", "② 아펜젤러 (H. G. Appenzeller)", "③ 언더우드 (H. G. Underwood)", "④ 스크랜턴 (W. B. Scranton)"], "a": "③ 언더우드 (H. G. Underwood)"}, {"n": 58, "q": "기독교대한감리회는 한국에게 최초로 목사 안수를 먼저 주었다. (1901년 5월 18일, 제17차 미국감리회 한국선교회) 그 중 1명으로 초기 한국 감리교회 부흥을 위해 헌신하여 “조선의 바울”이라는 별명을 얻은 목사는 누구인가?", "choices": ["① 김창식", "② 안중근", "③ 길선주", "④ 양주삼"], "a": "① 김창식"}, {"n": 59, "q": "초기 내한 선교사들이 세웠던 감리교회의 기관이 아닌 것은?", "choices": ["① 배재학당", "② 이화학당", "③ 협성신학교", "④ 장로회산학교"], "a": "④ 장로회산학교"}, {"n": 60, "q": "초기에 세워진 감리교회가 아닌 곳은?", "choices": ["① 정동교회", "② 종교교회", "③ 석교교회", "④ 새문안교회"], "a": "④ 새문안교회"}, {"n": 61, "q": "초기 내한 선교사들이 세웠던 감리교회의 기관이 아닌 것은?", "choices": ["① 배재학당", "② 이화학당", "③ 협성신학교", "④ 숭실학교"], "a": "④ 숭실학교"}, {"n": 62, "q": "초기 한국에 선교를 했던 감리교 선교사가 아닌 분은 누구인가?", "choices": ["① 아펜젤러 (H. G. Appenzeller)", "② 스크랜턴 (W. B. Scranton)", "③ 매클레이 (R. S. Maclay)", "④ 언더우드 (H. G. Underwood)"], "a": "④ 언더우드 (H. G. Underwood)"}, {"n": 63, "q": "주시경 선생과 함께 한글 띄어쓰기, 마침표 등을 도입하여 한글 살리기를 한 감리교 선교사는 누구인가?", "choices": ["① 헐버트 (W. B. Hulbert)", "② 길모어 (G. W. Gilmore)", "③ 베어드 (W. B. Baird)", "④ 스크랜턴 (W. B. Scranton)"], "a": "① 헐버트 (W. B. Hulbert)"}, {"n": 64, "q": "1907년 대부흥운동의 시작은 어디서 촉발되었나?", "choices": ["① 1903년 원산부흥운동", "② 신민회 조직", "③ 헤이그 특사 파견", "④ 영아소동"], "a": "① 1903년 원산부흥운동"}, {"n": 65, "q": "한국 최초의 집사목사안수를 받은 한국인으로서 평양지역 목회를 담당했던 이는 누구인가?", "choices": ["① 노블 (W. A. Noble)", "② 폴웰 (E. D. Follwell)", "③ 김창식", "④ 주시경"], "a": "③ 김창식"}, {"n": 66, "q": "최초의 공식 미국 이민으로 기록되는 1901년 해외 이민 장소는 어디인가?", "choices": [], "a": "하와이"}, {"n": 67, "q": "한국인에게 복음을 전하려는 목적으로 쓴 “성산명경”, “만종일련” 등을 지은 이는 누구인가?", "choices": ["① 유관순", "② 최병헌", "③ 길선주", "④ 안창호"], "a": "② 최병헌"}, {"n": 68, "q": "3.1운동으로 맞지 않는 것은?", "choices": ["① 3월 1일 서울 뿐만 아니라 평양, 진남포, 안주 등 9개 지역에서 만세운동이 일어났다.", "② 3.1운동에 있어서 여성교인들과 기독교 여학교 학생들의 참여와 역할이 두드러졌다.", "③ 3.1운동 당시 일제의 무력 진압에 피해를 입어 이후 적극적이고 과격한 무장투쟁이 국내에서 조직적으로 일어났다.", "④ 일본의 부당성과 식민지배로 인한 비참한 현실을 고발하고 민족의 독립 열망을 전 세계에 알리는 계기가 되었다."], "a": "③ 3.1운동 당시 일제의 무력 진압에 피해를 입어 이후 적극적이고 과격한 무장투쟁이 국내에서 조직적으로 일어났다."}, {"n": 69, "q": "신간회와 자매지구격이며 민족운동을 지향하였고 여성의 지위 향상이라는 시대적 과제를 가진 단체는?", "choices": [], "a": "근우회"}, {"n": 70, "q": "1930년 12월 2일 기독교조선감리회가 창립되면서 형성된 기독교조선(한국)감리교회의 원칙이 아닌 것은?", "choices": ["① 진정한 기독교회, 진정한 감리교회, 진정한 한국적 교회가 되게 하는 것", "② 신앙 및 신학 원리로 8개조를 담은 교리적 선언과 16개조를 담은 사회신경을 채택함", "③ 의회 구성에서 평신도와 성직자를 동수로 하고 여성 성직 문호를 개방할 것", "④ 한국감리교회의 자치시대를 열어 선교사들을 배제하는 원칙을 세울 것"], "a": "④ 한국감리교회의 자치시대를 열어 선교사들을 배제하는 원칙을 세울 것"}, {"n": 71, "q": "손정도 목사의 생애 및 목회활동과 관련이 없는 곳은?", "choices": ["① 정동제일교회", "② 진도", "③ 하얼빈", "④ 인천"], "a": "④ 인천"}, {"n": 72, "q": "경기도 강화의 유학자 집안의 출신으로 가정이 기독교로 개종하여 세례 받고, 배재학당과 협성신학교를 졸업하여 동대문, 정동교회에서 목회하였고, 성령의 능력을 받아 부흥운동을 일으켰던 인물이다. 총회에서 23회나 투표한 결과 1938년 10월 제3대 총리사로 피선되어 취임 후 1년이 채 안되는 기간 동안 재임하다 소천 받은 인물은 누구인가?", "choices": [], "a": "④ 김종우"}, {"n": 73, "q": "1941년 한국에서 활동 중인 선교사를 추방하기 위해 일제 당국이 조작한 사건은?", "choices": ["① 양주삼", "② 김영섭", "③ 변성옥", "④ 김종우"], "a": "만국부인기도회 사건"}, {"n": 74, "q": "괄호 안에 들어갈 단어는?\n“몇 년의 작업 끝에 1945년 7월 19일 한국의 모든 교파들을 통합하여 (     )을 형성하여 하나의 교회가 형성되어 감리교조선교단이 종말을 맞게 되었다.\"", "choices": ["① 조선통합교단", "② 초교파일본교회", "③ 일본기독교조선교단", "④ 기독교연합조선교단"], "a": "③ 일본기독교조선교단"}, {"n": 75, "q": "1960년 4.19혁명 이후, 자유당 독재 정권을 지지했던 교회에 대한 죄책 고백이 있었다. “감리교 생활”에 ‘반성과 참회’라는 제목으로 다음과 같은 글을 쓴 목사는 누구인가?\n“우리 교회가 과거에 저지른 과오는 무엇이었던가? 1) 교회는 정권과 손을 잡았거나 그렇지 않으면 이용하기도 하며 이용도당하였다. 교회는 언제나 야당적 입장에서 예언자적 위치를 고수해야 한다. 2) 교회는 한몸된 의식을 잊어버리고 교회 내에서 파쟁으로 교회를 약화시켰으며 교회가 사회 정화와 구원의 사명을 감당하지 못했다. 3) 교회는 속화되어 복음의 선전보다 교권의 장악을 위한 계획과 활동에 많은 시간과 정력을 허비하였다.”", "choices": ["① 마경일", "② 김종필", "③ 류형기", "④ 송흥국"], "a": "④ 송흥국"}, {"n": 76, "q": "괄호 안에 들어갈 단어는?\n“한국 감리교회 서클 정치의 기본 틀이 형성된 것은 1962년 7월 총회에서였다. 이 총회의 감독 선거에서 이환신, 변홍규, 김광우, 장석영, 임영빈이 출마한 가운데 평남 강동 출신의 ( ) 이환신 목사가 41차 투표 끝에 선출되었다. 이 파는 이북 출신 교회 정치 세력을 뜻했다.”", "choices": ["① 호헌파", "② 성화파", "③ 정동파", "④ 복흥파"], "a": "② 성화파"}, {"n": 77, "q": "1975년 선교대회에서 “우리의 선언”이란 성명서를 통해 선교 100주년을 바라보면서 감리교회는 “몇 교회, 몇만 신도 운동”을 추진하였는가?", "choices": ["① 1000교회 10만 신도운동", "② 2000교회 50만 신도운동", "③ 5000교회 100만 신도운동", "④ 10000교회 200만 신도운동"], "a": "③ 5000교회 100만 신도운동"}, {"n": 78, "q": "다음 괄호 안에 맞는 말은?\n“노동자들에 대한 전도가 선교로 발전된 1960년대 후반부터 노동자 교육, 노동조합 지도자 훈련, 노동조합 조직 지원과 같은 활동을 하면서 노동운동에 개입하기 시작한 형태의 교회활동을 (      )라 하였다.”", "choices": ["① 산업전도", "② 도시산업선교", "③ 도시선교", "④ 노동선교"], "a": "② 도시산업선교"}, {"n": 79, "q": "다음 설명은 누구에 관한 것인가?\n- 평화시장 재봉사였다.\n- 1970년 청계천 평화시장 입구에서 노동환경 개선을 요구하는 시위를 벌였다.\n- “근로기준법을 준수하라!”라 외치면서 분신하였다.", "choices": [], "a": "전태일"}, {"n": 80, "q": "1991년 남과 북의 통일을 대비하여 재건하기로 결의된 연회는 무슨 연회인가?", "choices": [], "a": "서부연회"}, {"n": 81, "q": "초기 내한 감리교 선교사들이 세웠던 기관은 무엇인가?", "choices": ["① 오산학교", "② 배재학당", "③ 경신학당", "④ 숭실학교"], "a": "② 배재학당"}, {"n": 82, "q": "초기 내한 감리교 선교사가 아닌 분은 누구인가?", "choices": ["① 아펜젤러(H. G. Appenzeller)", "② 알렌(H. N. Allen)", "③ 매클레이(R. S. Maclay)", "④ 스크랜턴(W. B. Scranton)"], "a": "② 알렌(H. N. Allen)"}, {"n": 83, "q": "주시경 선생과 함께 한글 띄어쓰기, 마침표 등을 도입하여 한글 살리기를 한 감리교 선교사는 누구인가?", "choices": ["① 헐버트(H. B. Hulbert)", "② 길모어(G. W. Gilmore)", "③ 베어드(W. B. Baird)", "④ 스크랜턴(W. B. Scranton)"], "a": "① 헐버트(H. B. Hulbert)"}, {"n": 84, "q": "1907년 대부흥운동을 발화시켰던 감리교 선교사 로버트 하디는 언제 어디서 부흥운동을 시작했는가?", "choices": ["① 원산", "② 선주", "③ 부산", "④ 공주"], "a": "① 원산"}, {"n": 85, "q": "한국 최초의 집사목사안수를 받은 한국인으로서 인천지역 목회를 담당했던 이는 누구인가?", "choices": ["① 한용경", "② 윤치호", "③ 김기범", "④ 언더우드(H. G. Underwood)"], "a": "③ 김기범"}, {"n": 86, "q": "초기 내한 감리교 선교사가 설립한 감리교회와 지역이 아닌 것은?", "choices": ["① 정동제일교회 - 서울", "② 내리교회 - 인천", "③ 산정현교회 - 평양", "④ 남산현교회 - 평양"], "a": "③ 산정현교회 - 평양"}, {"n": 87, "q": "한국인에게 복음을 전하기 위해 쓴 전도 책자인 『성산명경』, 『만종일련』은 누가 지었는가?", "choices": ["① 유관순", "② 최병헌", "③ 길선주", "④ 안창호"], "a": "② 최병헌"}, {"n": 88, "q": "다음 괄호 안에 맞는 단어를 쓰시오.\n“해방 후 교파 교회의 재건은 감리교회로부터 시작되었다. 1945년 9월 8일 새문안교회에서 소집된 남부대회에서 이규갑, 변홍규 목사 등 수십 명이 \"감리교회는 따로 재건하겠다\"고 회의장에서 퇴장하였다. 이들은 (      )파라 불리었다.”", "choices": [], "a": "재건"}, {"n": 89, "q": "괄호 안에 적절한 낱말을 고르시오.\n“1960년대 한국감리교회의 신학을 특징짓는 (      ) 신학작품으로 윤성범의 \"한국신학방법론설\"과 유동식의 \"한국종교와 기독교\"가 있다.\"", "choices": ["① 십자가", "② 토착화", "③ 개혁주의", "④ 복음주의"], "a": "② 토착화"}, {"n": 90, "q": "괄호에 맞는 말을 쓰시오.\n“(      ) 연회는 1946년 성화신학교를 설립하여 북한지역 감리교회를 이끌어 갈 교역자를 양성하고자 했다.”", "choices": [], "a": "서부"}, {"n": 91, "q": "1951년 11월 부산에서 열린 기독교대한감리회 특별총회에서 \"연회에서 정회원으로 6년 이상 계속 시무\"라는 감독자격 조항을 보류하여 선출된 감독은 누구인가?", "choices": ["① 양주삼", "② 김광우", "③ 이환신", "④ 류형기"], "a": "④ 류형기"}, {"n": 92, "q": "다음 설명 중 \"온양 선교정책협의회\"와 관련이 없는 것을 고르시오.", "choices": ["① 한국 및 미국감리교회가 모자관계에서 동반자관계로 바꾸는 문제 협의", "② 1968년에 온양에서 열림", "③ 협의 결과 한국교회에 이양할 선교부 재산목록에는 학교, 병원, 사회관 등이 있었음", "④ 한국의 인권문제, 총리원의 관계 문제, 감리교 분열문제 등으로 이양 추진은 이루어지지 않음"], "a": "④ 한국의 인권문제, 총리원의 관계 문제, 감리교 분열문제 등으로 이양 추진은 이루어지지 않음"}, {"n": 93, "q": "다음 괄호 안에 알맞은 이름을 고르시오.\n“도시산업선교는 이렇게 공장노동자들의 권익을 위해서 활동했지만, 노동자들이 자신들의 권익을 위해서 주장할 수 있게 된 것은 (     ) 같은 노동자들의 노동운동 때문이었다.\"", "choices": ["① 문익환", "② 전태일", "③ 이윤영", "④ 이익모"], "a": "② 전태일"}, {"n": 94, "q": "3.1운동에 가담한 기독교측 민족 대표 중에 감리교측 인사가 아닌 사람은 누구인가?", "choices": ["① 신석구", "② 이필주", "③ 이승훈", "④ 오화영"], "a": "③ 이승훈"}, {"n": 95, "q": "감리교 목사로서 정동교회를 담임하였고, 1919년 4월 10일에 상해 임시정부 부의장으로 선출된 후 이어 의장으로 선출되어 대한민국 임시정부 수립에 산파 역할을 하였다. 만주 선교에 관심을 가진 그는 1921년 만주 길림으로 들어가 교회를 담임하면서 독립운동을 전개하였다. 이 인물은 누구인가?", "choices": [], "a": "손정도"}, {"n": 96, "q": "1920-1930년대 한국교회 대표적인 사회운동으로 술, 담배, 성매매 근절 및 개선운동으로 민족주의적인 성격을 가진 운동은 무엇인가?", "choices": [], "a": "절제운동"}, {"n": 97, "q": "기독교조선감리회의 초대 총리사는 누구인가?", "choices": ["① 손정도", "② 류형기", "③ 김종우", "④ 양주삼"], "a": "④ 양주삼"}, {"n": 98, "q": "다음 중 정경옥과 비교적 관계가 없는 것은?", "choices": ["① 기독교 부흥운동", "② 토착화, 향토화", "③ 복음적 자유주의 신학사상", "④ 기독교 신학개론"], "a": "① 기독교 부흥운동"}, {"n": 99, "q": "괄호에 맞는 말을 쓰시오.\n“(          )는 중부연회 다음가는 교세를 지니고 있었다. 영변, 신창, 평양, 진남포, 해주, 사리원의 6개 지방에 58구역으로 조직되었는데 이 지역은 원래 북감리교회의 선교구역이었다.”", "choices": [], "a": "서부연회"}, {"n": 100, "q": "일제의 신사참배 강압에 맞서 신사참배를 거부하고 신앙을 지킨 감리교회의 인물이 아닌 사람은 누구인가?", "choices": ["① 강종근", "② 박희도", "③ 권원호", "④ 최인규"], "a": "② 박희도"}];
let list=[],at=0,checked={},answers={};
const $=id=>document.getElementById(id);
const norm=s=>String(s??"").toLowerCase().replace(/\s+/g,"").replace(/[“”"'‘’.,!?·()[\]「」『』]/g,"");
function key(q){return "kmh-study-"+q.n}
function loadSaved(q){try{return JSON.parse(localStorage.getItem(key(q))||"{}")}catch(e){return {}}}
function save(q,obj){try{localStorage.setItem(key(q),JSON.stringify(obj))}catch(e){}}
function start(){let count=+$("count").value;list=all.slice();if($("order").value==="random")list.sort(()=>Math.random()-.5);list=list.slice(0,count);at=0;checked={};render()}
function render(){if(!list.length)return;let q=list[at],saved=loadSaved(q);$("position").textContent=`${at+1} / ${list.length}번 문제 · 원본 ${q.n}번`;$("question").textContent=q.q;$("bar").style.width=((at+1)/list.length*100)+"%";$("score").textContent=`정답 ${Object.values(checked).filter(x=>x===true).length}개`;
$("choices").innerHTML="";$("typed").classList.toggle("hidden",q.choices.length>0);
if(q.choices.length){q.choices.forEach((c,i)=>{let lab=document.createElement("label");lab.className="choice";let inp=document.createElement("input");inp.type="radio";inp.name="choice";inp.value=i;inp.checked=saved.pick===i;let span=document.createElement("span");span.textContent=c;lab.append(inp,span);$("choices").append(lab)})}
else{$("typed").value=saved.text||""}
$("feedback").className="feedback";$("feedback").textContent="";$("prev").disabled=at===0;$("next").textContent=at===list.length-1?"학습 완료":"다음 문제";
}
function userAnswer(q){if(q.choices.length){let x=document.querySelector('input[name="choice"]:checked');return x? q.choices[+x.value] : ""}return $("typed").value.trim()}
function persist(){if(!list.length)return;let q=list[at],obj=loadSaved(q);if(q.choices.length){let x=document.querySelector('input[name="choice"]:checked');obj.pick=x?+x.value:null}else obj.text=$("typed").value;save(q,obj)}
function check(){if(!list.length)return;let q=list[at],u=userAnswer(q);persist();if(!u){$("feedback").className="feedback bad";$("feedback").textContent=q.choices.length?"보기를 하나 선택해 줘.":"답을 입력해 줘.";return}
let ok=norm(u)===norm(q.a);checked[q.n]=ok;$("feedback").className="feedback "+(ok?"good":"bad");$("feedback").textContent=ok?"정답이야!":`아쉬워. 다시 확인해 봐. 정답: ${q.a}`;$("score").textContent=`정답 ${Object.values(checked).filter(x=>x===true).length}개`;
}
function reveal(){if(!list.length)return;let q=list[at];$("feedback").className="feedback good";$("feedback").textContent="정답: "+q.a}
$("start").onclick=start;$("check").onclick=check;$("reveal").onclick=reveal;$("prev").onclick=()=>{persist();if(at>0){at--;render()}};$("next").onclick=()=>{persist();if(at<list.length-1){at++;render()}else{$("question").textContent=`학습 완료! ${list.length}문제를 모두 확인했어.`;$("choices").innerHTML="";$("typed").classList.add("hidden");$("feedback").className="feedback good";$("feedback").textContent=`정답 ${Object.values(checked).filter(x=>x===true).length}개를 맞혔어.`}};
$("typed").addEventListener("input",persist);$("choices").addEventListener("change",persist);document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();check()}});
</script></body></html>
